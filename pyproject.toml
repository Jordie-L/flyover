[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flyover"
version = "0.1.0"
description = "Overhead-flight display for a Raspberry Pi and an RGB LED matrix"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10",
    # Windows has no system time zone database; Linux and macOS do.
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["flyover*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
